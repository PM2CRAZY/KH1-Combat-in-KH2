[workspace]
resolver = "2"
members = [
    "crates/kh2-hook",
    "crates/kh2-formats",
    "crates/kh2-anim",
    "crates/kh1-data",
    "crates/kh1-assets",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
kh2-formats = { path = "crates/kh2-formats" }
kh2-anim = { path = "crates/kh2-anim" }
kh1-data = { path = "crates/kh1-data" }
kh1-assets = { path = "crates/kh1-assets" }
md-5 = "0.10"
sha2 = "0.10"
flate2 = "1"
thiserror = "1"
lewton = "0.10"

[profile.release]
debug = "line-tables-only"
